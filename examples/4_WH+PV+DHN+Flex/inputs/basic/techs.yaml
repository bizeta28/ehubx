techs:

- tech_id: DC #Data center with a demand based on workload converting IT-load (electricity) to unusable waste heat
  type: conversion
  tech_params:
    lifetime: 10 a
    trl:
    unit_cap_min: 20 kW
  costs:
    one_time_capex:
    capex_per_cap: #8500 CHF/kW # 8244 CHF/kW
    one_time_opex:
    opex_per_cap: #165 CHF/kW
    opex_per_energy:
  emissions:
    co2_per_cap: 3315 kg/kW
  conversion_params:
    in_ecs:
    - in_id: El
      in_part: 1 kWh
    #main_in_ec: El
    out_ecs:
    - ec_id: WH
      out_eff: 1 kWh/kWh
    - ec_id: IT
      out_eff: 1 kWh/kWh
    main_out_ec: WH

- tech_id: CS_hybrid #HC system - combination of air and liquid (DTC)
  type: conversion
  tech_params:
    lifetime: 5 a
    trl:
    unit_cap_min:
  costs:
    one_time_capex:
    capex_per_cap:
    one_time_opex:
    opex_per_cap:
    opex_per_energy:
  emissions:
    co2_per_cap:
  conversion_params:
    in_ecs:
    - in_id: El
      in_part: 0.5 kWh # PUE-1
    - in_id: WH
      in_part: 1.0 kWh # Q_WH = P_IT
    main_in_ec: WH
    out_ecs:
    - ec_id: Air
      out_eff: 0.48 kWh/kWh # eta_AC * (P_tot - eta_LC * P_IT) = 0.8 (1.5 - 0.9*1)
    - ec_id: HT
      out_eff: 0.9 kWh/kWh # eff_LC * P_IT
    main_out_ec: HT

- tech_id: HE_AW #Heat Exchanger between the air leaving the DC air cooling system (around 25 °C) and the low-temperature network (around 10°C at NEST)
  type: conversion
  tech_params:
    lifetime: 20 a
    trl:
  costs:
    one_time_capex:
    capex_per_cap: 145 CHF/kW
    one_time_opex:
    opex_per_cap: 1.1 CHF/kW
    opex_per_energy:
  emissions:
    co2_per_cap: 12 kg/kW #from ChatGPT
  conversion_params:
    in_ecs:
    - in_id: Air
      in_part: 1 kWh
    #main_in_ec: Hightemp
    out_ecs:
    - ec_id: LT
      out_eff: 0.90 kWh/kWh #lower than water to water, but the deltaT is large so not too low. Maybe we can have a formula here
    #main_out_ec: Mediumtemp

- tech_id: HP_WW #Heat pump upgrading the air exiting the medium temperature network to high temperature suitable for domestic hot water (around 60 °C)
  type: conversion
  tech_params:
    lifetime: 20 a
    trl:
  costs:
    one_time_capex:
    capex_per_cap: 1370 CHF/kW
    one_time_opex: 430 CHF
    opex_per_cap:
    opex_per_energy:
  emissions:
    co2_per_cap: 30 kg/kW #from ChatGPT
  conversion_params:
    in_ecs:
    - in_id: MT
      in_part: 1 kWh
    - in_id: El
      in_part: 1 kWh
    main_in_ec: El
    out_ecs:
    - ec_id: HT
      out_eff: profiles/HPCOPprofile.csv
    #main_out_ec: Mediumtemp

- tech_id: HE_WW #Heat Exchanger between high temperature and medium temperature networks
  type: conversion
  tech_params:
    lifetime: 20 a
